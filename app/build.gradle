plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ir.makanban.app'
    compileSdk 34

    defaultConfig {
        applicationId "ir.makanban.app"
        minSdk 26          // اندروید ۸ به بعد
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            // در بیلد GitHub Actions با متغیرهای محیطی امضا می‌شود
            def storeFilePath = System.getenv("MAKANBAN_STORE_FILE")
            if (storeFilePath != null && !storeFilePath.isEmpty()) {
                storeFile file(storeFilePath)
                storePassword System.getenv("MAKANBAN_STORE_PASSWORD")
                keyAlias System.getenv("MAKANBAN_KEY_ALIAS")
                keyPassword System.getenv("MAKANBAN_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def ciSigning = System.getenv("MAKANBAN_STORE_FILE") != null && !System.getenv("MAKANBAN_STORE_FILE").isEmpty()
            signingConfig ciSigning ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
