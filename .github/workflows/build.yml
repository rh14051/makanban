name: بیلد مکان‌بان

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: ساخت APK امضاشده
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب جاوا ۱۷
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ساخت keystore موقت برای امضا
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/makanban.keystore" \
            -alias makanban \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass MakanBanSecret2024 -keypass MakanBanSecret2024 \
            -dname "CN=MakanBan, OU=Mobile, O=MakanBan, L=Tehran, C=IR"

      - name: نصب گریدل
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: بیلد APK ریلیز
        env:
          MAKANBAN_STORE_FILE: ${{ github.workspace }}/makanban.keystore
          MAKANBAN_STORE_PASSWORD: MakanBanSecret2024
          MAKANBAN_KEY_ALIAS: makanban
          MAKANBAN_KEY_PASSWORD: MakanBanSecret2024
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: تغییر نام APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk "output/MakanBan-${GITHUB_REF_NAME}.apk"

      - name: آپلود Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MakanBan-APK
          path: output/*.apk
          if-no-files-found: error

      - name: انتشار در GitHub Releases (فقط روی تگ)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-ghrelease@v2
        with:
          files: output/*.apk
          generate_release_notes: true
